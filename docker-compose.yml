services:
  postgres:
    image: postgres:16-alpine
    container_name: safari-erp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: safari_erp
    ports:
      - "5432:5432"
    volumes:
      - safari_erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safari_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  safari_erp_pgdata:
