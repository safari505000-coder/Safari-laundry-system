<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expo Go — QR</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f7ff;
      color: #1a2a5e;
    }
    h1 { font-size: 1.25rem; margin-bottom: 0.25rem; }
    p { margin: 0.25rem 0 1.5rem; color: #555; font-size: 0.95rem; }
    img {
      border: 12px solid #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(45, 91, 238, 0.15);
    }
    code {
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
      background: #fff;
      border-radius: 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>مجموعة مصابغ سفاري — Expo Go</h1>
  <p>امسح من تطبيق Expo Go (نفس Wi‑Fi)</p>
  <img
    src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=exp%3A%2F%2F192.168.8.112%3A8081"
    width="400"
    height="400"
    alt="Expo Go QR Code"
  />
  <code>exp://192.168.8.112:8081</code>
</body>
</html>
