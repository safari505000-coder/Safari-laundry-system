الدستور

وهذي نسخة معتمدة مختصرة وواضحة تقدر تعتمدها رسميًا:

⸻

📘 دستور تدفق الفواتير (النسخة المعتمدة)

1) تعريف الحالات (عرض فقط)

الفاتورة تمر بـ 4 مراحل:

1. UNPAID
    * قبل الدفع
    * تظهر في الكرت الأحمر (الكول سنتر)
2. PAID_TO_DRIVER
    * تم استلام المبلغ من السائق
    * تظهر في مديونيات السائقين
3. PAID_TO_BRANCH_MANAGER (مشتقة)
    * السائق سلّم المدير
    * تظهر في مديونيات مدراء الفروع
4. SETTLED (مشتقة)
    * تم تأكيد الإيداع من المحاسب
    * تختفي من الشاشات التشغيلية

⸻

2) قاعدة الانتقال (ثابتة)

الفاتورة تتحرك مرحلة واحدة فقط في كل خطوة:

UNPAID → PAID_TO_DRIVER → PAID_TO_BRANCH_MANAGER → SETTLED

❗ لا يوجد رجوع للخلف
❗ لا يوجد تخطي مراحل

⸻

3) قاعدة الظهور

* كل شاشة تعرض الفاتورة حسب مرحلتها فقط
* الفاتورة لا تظهر في أكثر من مرحلة بنفس الوقت

⸻

4) قاعدة البيانات

* الحالات المخزنة فعليًا في النظام = 3 فقط
* الحالات الأربع في الدستور = تفسير (Lifecycle) وليس تخزين

⸻

5) قاعدة الأرقام

إجمالي المستحقات = جميع الفواتير غير SETTLED

* الكرت الأحمر + مديونيات السائقين + مديونيات المدراء
    = الصورة الكاملة

⸻

6) أسباب اختلاف الأرقام (ليست أخطاء)

أ) الفلاتر

* كل شاشة لها نطاق مختلف

ب) التحديث

* بعض الشاشات لحظية
* وبعضها يدوي

ج) الدفع باللينك

* يبقى UNPAID حتى يتم الدفع

⸻

7) قاعدة تقنية إلزامية

* يمنع استخدام cashStatus مباشرة في المنطق
* يجب استخدام lifecycle فقط
* يمنع تكرار الفلاتر في أكثر من مكان

⸻

8) قيود النظام (ثابتة)

* ❌ لا تعديل على قاعدة البيانات
* ❌ لا إضافة حقول
* ❌ لا تغيير UI
* ❌ لا تغيير الحسابات

⸻

🎯 الخلاصة

هذا الدستور يحدد:

* حركة الفاتورة
* أماكن ظهورها
* تفسير الأرقام

بدون أي تغيير في:

* البيانات
* التصميم
* أو الحسابات

⸻

إذا تبي، أقدر أحوله لك إلى:

* ￼ “وثيقة رسمية PDF” تعتمدها داخل شركتك
    أو
* ￼ “CheckList مراجعة” تستخدمها قبل أي تحديث عشان ما يغلط المبرمج 👍