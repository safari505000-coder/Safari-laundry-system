<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1022"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1022"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="78%" cy="62%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.24"/>
      <stop offset="65%" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="320" cy="210" r="360" fill="url(#glow1)"/>
  <circle cx="940" cy="420" r="390" fill="url(#glow2)"/>

  <!-- AI mark -->
  <g transform="translate(260, 315)">
    <rect x="-58" y="-58" width="116" height="116" rx="28" fill="#111b33" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M-22 10c0-17.7 14.3-32 32-32s32 14.3 32 32" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="10" cy="10" r="10" fill="#e2e8f0"/>
    <circle cx="40" cy="-34" r="6" fill="#67e8f9"/>
    <circle cx="-36" cy="36" r="5" fill="#a78bfa" filter="url(#soft)"/>
  </g>

  <!-- Title -->
  <g font-family="Cairo, Almarai, system-ui, -apple-system, Segoe UI, Arial, sans-serif">
    <text x="360" y="320" font-size="78" font-weight="800" fill="#e2e8f0" letter-spacing="-0.5">
      Safari Omni
    </text>
    <text x="362" y="380" font-size="34" font-weight="700" fill="#94a3b8">
      F8'E 'D%/'1) 'D0CJ
    </text>
    <text x="362" y="430" font-size="22" font-weight="600" fill="#38bdf8" opacity="0.95">
      AI-Powered Operations
    </text>
  </g>
</svg>

