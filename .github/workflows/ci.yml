name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'

jobs:
  unit-test:
    name: Backend — TypeScript + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript typecheck (backend)
        run: npx tsc --noEmit

      - name: Run backend unit test suite
        run: npx jest --no-coverage --runInBand --forceExit
        env:
          NODE_ENV: test
          V20_4_FINAL_LEDGER: 'true'

  integration-test:
    name: Backend — Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: safari_erp_test
          POSTGRES_USER: safari_test
          POSTGRES_PASSWORD: safari_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations on test DB
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://safari_test:safari_test@localhost:5432/safari_erp_test

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://safari_test:safari_test@localhost:5432/safari_erp_test
          NODE_ENV: test
          V20_4_FINAL_LEDGER: 'true'
          V20_3_TRUE_ACCOUNTING: 'true'
          USE_JOURNAL_AS_SOURCE: 'true'
          BCRYPT_WORKERS: '0'
          SYSTEM_GUARDIAN_ENABLED: '0'

  frontend-check:
    name: Frontend — TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: TypeScript typecheck (frontend)
        run: npx tsc --noEmit
        working-directory: web

  deploy:
    name: Deploy to Render (production)
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test, frontend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && success()
    environment:
      name: production
      url: https://www.safariomni.com

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret is not set; skipping deploy trigger."
            exit 0
          fi
          echo "Triggering Render deploy..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deploy hook triggered."
