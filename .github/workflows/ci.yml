name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'

jobs:
  unit-test:
    name: Backend — TypeScript + Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript typecheck (backend)
        run: npx tsc --noEmit

      - name: Run backend unit test suite
        run: npx jest --no-coverage --runInBand --forceExit
        env:
          NODE_ENV: test
          V20_4_FINAL_LEDGER: 'true'

  integration-test:
    name: Backend — Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/safari_erp_test
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safari_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/safari_erp_test

      # Service healthchecks are best-effort; wait until TCP accepts on the host-mapped port.
      - name: Wait for PostgreSQL (TCP-ready)
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if { echo >/dev/tcp/127.0.0.1/5432; } &>/dev/null; then
              echo "Postgres reachable on 127.0.0.1:5432 (attempt ${i})"
              exit 0
            fi
            echo "::notice::Waiting for Postgres TCP… (${i}/60)"
            sleep 1
          done
          echo "::error::Postgres did not become reachable on localhost:5432"
          exit 1

      - name: Deploy database schema
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/safari_erp_test

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/safari_erp_test
          ACCOUNTANT_DASHBOARD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/safari_erp_test
          NODE_ENV: test
          V20_4_FINAL_LEDGER: 'true'
          V20_3_TRUE_ACCOUNTING: 'true'
          USE_JOURNAL_AS_SOURCE: 'true'
          BCRYPT_WORKERS: '0'
          SYSTEM_GUARDIAN_ENABLED: '0'
          OPERATING_HOURS_LOCK_ENABLED: 'false'

  frontend-check:
    name: Frontend — TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: TypeScript typecheck (frontend)
        run: npx tsc --noEmit
        working-directory: web

  mobile-logic-test:
    name: Mobile — logic guards (driver + customer)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies (workspace root)
        run: npm ci

      - name: Install employee-mobile dependencies
        run: npm ci
        working-directory: apps/employee-mobile

      - name: Install customer-mobile dependencies
        run: npm ci
        working-directory: apps/customer-mobile

      - name: Run mobile delivery/UI logic tests
        run: npm run mobile:test:logic

  deploy:
    name: Deploy to Render (production)
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test, frontend-check, mobile-logic-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && success()
    environment:
      name: production
      url: https://www.safariomni.com

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret is not set; skipping deploy trigger."
            exit 0
          fi
          echo "Triggering Render deploy..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deploy hook triggered."
