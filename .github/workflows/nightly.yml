name: Nightly Tests

on:
  schedule:
    # 02:00 UTC daily (= 05:00 Kuwait time, AST = UTC+3)
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  full-suite:
    name: Full Test Suite (Unit + Integration + Security Audit)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/safari_erp_test
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safari_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript typecheck (backend)
        run: npx tsc --noEmit

      - name: Run backend unit test suite
        run: npx jest --no-coverage --runInBand --forceExit
        env:
          NODE_ENV: test
          V20_4_FINAL_LEDGER: 'true'

      - name: Wait for PostgreSQL (TCP-ready)
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if { echo >/dev/tcp/127.0.0.1/5432; } &>/dev/null; then
              echo "Postgres reachable on 127.0.0.1:5432 (attempt ${i})"
              exit 0
            fi
            echo "::notice::Waiting for Postgres TCP… (${i}/60)"
            sleep 1
          done
          echo "::error::Postgres did not become reachable on localhost:5432"
          exit 1

      - name: Deploy database schema
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/safari_erp_test

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/safari_erp_test
          ACCOUNTANT_DASHBOARD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/safari_erp_test
          NODE_ENV: test
          V20_4_FINAL_LEDGER: 'true'
          V20_3_TRUE_ACCOUNTING: 'true'
          USE_JOURNAL_AS_SOURCE: 'true'
          BCRYPT_WORKERS: '0'
          SYSTEM_GUARDIAN_ENABLED: '0'
          OPERATING_HOURS_LOCK_ENABLED: 'false'

      - name: Backend npm audit (critical only — gating)
        run: npm audit --audit-level=critical

      - name: Frontend npm audit (critical only — gating)
        run: npm audit --audit-level=critical
        working-directory: web
